<!doctype html>
<html lang="ar" dir="rtl">
  <head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#04796C"><link rel="icon" href="assets/logo.png"><link rel="manifest" href="manifest.webmanifest"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600&display=swap"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css"><script src="lite.js"></script><script src="sfx.js" defer></script><script src="loader.js"></script><title>الملاحظات | YOMAK</title>
  </head>
  <body data-page="notes">
    <div id="app">
      <aside>
<a class="brand" href="index.html"><img src="assets/logo.png" alt="شعار يومك"><span>YOMAK<small>يومك، على ترتيبك</small></span></a><p class="muted">مساحة إنجازك اليومية</p>
        <nav id="nav">
<span class="nav-label">الرئيسية</span><a data-page="dashboard" href="dashboard.html">الرئيسية</a><a data-page="today" href="today.html">مهام اليوم<em class="badge" id="nToday" hidden></em></a><span class="nav-label">المهام</span><a data-page="all" href="tasks.html">كل المهام</a><a data-page="upcoming" href="upcoming.html">القادمة</a><a data-page="completed" href="completed.html">المكتملة</a><a data-page="late" href="late.html">المتأخرة<em class="badge late" id="nLate" hidden></em></a><span class="nav-label">أدواتك</span><a data-page="planner" href="planner.html">خطة يومي</a><a data-page="focus" href="focus.html">وضع التركيز</a><a data-page="rewards" href="rewards.html">المكافآت</a><a data-page="heatmap" href="heatmap.html">خريطة الإنتاجية</a><a data-page="board" href="board.html">لوحة YOMAK</a><a data-page="wrapup" href="wrapup.html">ملخص اليوم</a><a data-page="story" href="story.html">يومك كقصة</a><a data-page="calendar" href="calendar.html">التقويم</a><span class="nav-label">المزيد</span><a data-page="stats" href="statistics.html">الإحصائيات</a><a data-page="settings" href="settings.html">الإعدادات</a>
          <div hidden>
<button data-view="today" class="active">مهام اليوم</button><button data-view="all">كل المهام</button><button data-view="upcoming">القادمة</button><button data-view="completed">المكتملة</button>
          </div>
        </nav>
        <div class="aside-bottom">
<span id="userEmail"></span><button id="logout" class="secondary">تسجيل الخروج</button>
        </div>
      </aside>
<script src="sidenav.js"></script>
      <main>
        <header>
          <div>
<p class="eyebrow">YOMAK / الملاحظات</p><h1>الملاحظات</h1><p class="muted" id="dateLabel"></p>
          </div>
<button id="ntNew" aria-label="ملاحظة جديدة">+ ملاحظة جديدة</button>
        </header>
        <section class="panel nt-compose">
          <form id="ntQuick" class="nt-quick">
<input id="ntQ" maxlength="200" placeholder="اكتب ملاحظة سريعة واضغط Enter..." aria-label="ملاحظة سريعة" autocomplete="off"><button type="submit" id="ntQSave">حفظ</button>
          </form>
        </section>
        <section class="nt-tools">
          <div class="nt-search">
<input id="ntSearch" type="search" placeholder="ابحث في العناوين والمحتوى..." aria-label="بحث">
          </div>
          <div class="nt-cats" id="ntCats" role="tablist" aria-label="التصنيفات">
          </div>
        </section>
        <div id="ntBody">
        </div>
      </main>
    </div>
    <dialog id="ntDialog">
      <form id="ntForm">
        <div class="dialog-head">
<h2 id="ntDTitle">ملاحظة جديدة</h2><button type="button" class="icon-btn" id="ntClose" aria-label="إغلاق">✕</button>
        </div>
<label>العنوان<input id="ntTitle" maxlength="120" placeholder="عنوان (اختياري)"></label><label>المحتوى<textarea id="ntText" rows="7" maxlength="5000" placeholder="اكتب ملاحظتك هنا..."></textarea></label>
        <div class="two">
<label>التصنيف<select id="ntCat"></select></label><label>ربط بمهمة<select id="ntTask"></select></label>
        </div>
<label class="nt-pinrow"><input type="checkbox" id="ntPin"> 📌 تثبيت الملاحظة في الأعلى</label>
        <div class="dialog-actions">
<button type="button" class="danger" id="ntDel" hidden>🗑 حذف</button><button type="submit" id="ntSave">حفظ</button>
        </div>
      </form>
    </dialog>
<script src="select-ui.js" defer></script><script type="module" src="notes.js"></script><script type="module" src="topbar.js"></script>
  </body>
</html>
